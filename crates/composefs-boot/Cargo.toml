[package]
name = "composefs-boot"
description = "Helpers for bootable composefs systems"
keywords = ["composefs", "boot"]

edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["composefs-integration"]
composefs-integration = ["dep:anyhow", "dep:composefs", "dep:fn-error-context", "dep:pcre2", "dep:regex-automata", "dep:rustix"]

[dependencies]
anyhow = { version = "1.0.87", default-features = false, optional = true }
fn-error-context = { version = "0.2", optional = true }
composefs = { workspace = true, optional = true }
pcre2 = { version = "0.2.11", optional = true }
regex-automata = { version = "0.4.4", default-features = false, features = ["hybrid", "std", "syntax"], optional = true }
rustix = { version = "1.0.0", default-features = false, features = ["fs", "std"], optional = true }
thiserror = { version = "2.0.0", default-features = false }
zerocopy = { version = "0.8.0", default-features = false, features = ["derive"] }

[dev-dependencies]
composefs = { workspace = true, features = ["test"] }
indoc = "2"
proptest = "1"
similar-asserts = "2.0.0"

[lints]
workspace = true
